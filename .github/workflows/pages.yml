name: Deploy Tower Defence

on:
  push:
    branches:
      - Update

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ดาวน์โหลดไฟล์จาก branch Update
      - name: Checkout
        uses: actions/checkout@v6

      # เตรียมระบบ GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # เอาไฟล์เกมจากโฟลเดอร์ลึกมาเป็น root ของเว็บไซต์
      - name: Prepare Tower Defence
        run: |
          mkdir -p _site
          cp -R ".gemini/antigravity-ide/scratch/Tower-Defence-main/." "_site/"

      # ตรวจสอบว่า index.html ถูกนำมาแล้ว
      - name: Check website files
        run: |
          echo "===== Website files ====="
          ls -la _site
          echo "===== index.html ====="

          if [ ! -f "_site/index.html" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          echo "index.html found successfully."

      # สร้าง GitHub Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      # Deploy ไปยัง GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
